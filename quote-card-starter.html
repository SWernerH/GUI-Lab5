<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quote Card Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <header>
    <h1>Quote Card</h1>
    <p>Promise.all · picsum.photos · dummyjson.com</p>
  </header>

  <button id="btn">Generate</button>

  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    Fetching image &amp; quote…
  </div>

  <p class="status" id="status"></p>

  <div class="card-wrap" id="card">
    <img id="photo" alt="background photograph" src="https://picsum.photos/id/15/800/420" class="loaded" />
    <div class="overlay">
      <div class="quote-mark">"</div>
      <p class="quote-text"   id="quote-text">The only way to do great work is to love what you do.</p>
      <p class="quote-author" id="quote-author">— Steve Jobs</p>
    </div>
  </div>

  <script>
    /*
     * APIs — both free, no authentication, CORS-safe for browser fetch()
     * ─────────────────────────────────────────────────────────────────────
     * Quote : GET https://dummyjson.com/quotes/random
     *         Returns { id, quote, author }
     *
     * Image : https://picsum.photos/id/{n}/800/420
     *         No fetch() needed — the URL IS the image.
     *         We wrap the browser's img load event in a Promise so it can
     *         participate in Promise.all() alongside the quote fetch.
     *
     * CONCEPTS DEMONSTRATED
     * ─────────────────────
     *  1. fetchJSON()      — reusable helper: fetch + response.ok check
     *  2. loadImage()      — wraps an img load event in a Promise
     *  3. Promise.all()    — quote fetch and image load run in parallel
     *  4. Shape validation — check data before trusting it
     *  5. .catch()         — one handler covers both promises
     *  6. .finally()       — cleans up UI in all cases
     */

    var QUOTE_API  = 'https://dummyjson.com/quotes/random';
    var IMAGE_BASE = 'https://picsum.photos/id/';

    // ── DOM refs ───────────────────────────────────────────────────────────
    var btn         = document.getElementById('btn');
    var spinner     = document.getElementById('spinner');
    var statusEl    = document.getElementById('status');
    var card        = document.getElementById('card');
    var photo       = document.getElementById('photo');
    var quoteText   = document.getElementById('quote-text');
    var quoteAuthor = document.getElementById('quote-author');

    // Show card immediately — placeholder content is already in the HTML
    card.style.display = 'block';
    card.classList.add('ready');

    // ── Helper 1: fetchJSON ────────────────────────────────────────────────
    // Wraps fetch() with a response.ok check
    // Returns Promise<Object> — no .catch() here, callers decide
    function fetchJSON(url) {
      return fetch(url)
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ' from ' + url);
          }
          return response.json();
        });
    }

    // ── Helper 2: loadImage ────────────────────────────────────────────────
    // Wraps the browser img load/error events in a Promise
    // Resolves with the URL once the image is cached by the browser
    // Rejects with an Error if the image cannot be loaded
    // This lets an image load participate in Promise.all()
    function loadImage(url) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.addEventListener('load',  function () { resolve(url); });
        img.addEventListener('error', function () { reject(new Error('Image failed to load')); });
        img.src = url;
      });
    }

    // ── Pick a random picsum image URL ─────────────────────────────────────
    // picsum has reliable photo IDs in the range 1–100
    function randomImageUrl() {
      var id = Math.floor(Math.random() * 100) + 1;
      return IMAGE_BASE + id + '/800/420';
    }

    // ── Button handler ─────────────────────────────────────────────────────
    btn.addEventListener('click', function () {
      // Reset state before each new request
      statusEl.textContent = '';
      card.classList.remove('ready');
      photo.classList.remove('loaded');
      btn.disabled = true;
      spinner.classList.add('active');

      var imageUrl = randomImageUrl();

      // Promise.all fires both operations simultaneously.
      // Neither waits for the other.
      // The .then() only runs when BOTH have resolved.
      Promise.all([
        fetchJSON(QUOTE_API),   // Promise<Object>  — resolves with quote data
        loadImage(imageUrl)     // Promise<String>  — resolves with the image URL
      ])
        .then(function (results) {
          var quoteData      = results[0];  // { id, quote, author }
          var resolvedImgUrl = results[1];  // the image URL, now cached by browser

          // Validate the quote shape before trusting it
          if (!quoteData.quote || !quoteData.author) {
            throw new Error('Unexpected quote shape — missing "quote" or "author".');
          }

          // Populate and display
          quoteText.textContent   = quoteData.quote;
          quoteAuthor.textContent = '— ' + quoteData.author;

          // Because loadImage() already downloaded the image, setting src here
          // renders it from the browser cache — no second network request
          photo.src = resolvedImgUrl;
          photo.classList.add('loaded');

          // Adding .ready triggers the CSS opacity transitions on the text
          card.classList.add('ready');
        })

        // One .catch() covers:
        //  - network failure in fetchJSON()
        //  - HTTP error thrown in fetchJSON()
        //  - image load failure in loadImage()
        //  - our manual shape validation throw
        .catch(function (err) {
          statusEl.textContent = 'Error: ' + err.message;
        })

        // Runs whether the chain resolved or rejected
        .finally(function () {
          btn.disabled = false;
          spinner.classList.remove('active');
        });
    });
  </script>
</body>
</html>
